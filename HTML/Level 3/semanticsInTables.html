<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML - Level 3</title>
</head>
<body>
    <table>
        <caption>Food Menu</caption>

        <!-- Table Header -->
        <thead>
            <!-- Row 1 -->
            <tr>
                <th>Item</th>
                <th>Price</th>
            </tr> 
        </thead>

        <!-- Table Body -->
        <tbody>
            <!-- Row 2 -->
            <tr>
                <td>Frooti</td>
                <td>10</td>
            </tr>

            <!-- Row 3 -->
            <tr>
                <td>Samosa</td>
                <td>12</td>
            </tr>

            <!-- Row 4 -->
            <tr>
                <td>Chips</td>
                <td>20</td>
            </tr>
        </tbody>
        
    </table>
</body>
</html>
