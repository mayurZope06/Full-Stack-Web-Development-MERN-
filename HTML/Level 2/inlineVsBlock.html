<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline v/s Block</title>
</head>
<body>
    <!-- Heading Element -> block -->
    <h1>Hello World</h1>
    <h1>Apna College</h1>

    <!-- Paragraph Element -> block -->
     <p>Hello World</p>
     <p>Apna College</p>

    <!-- Anchor Tag -> inline element -->
     <a href="www.google.com">Google Me</a>
     <a href="www.facebook.com">Facebook Me</a>
     <a href="www.youtube.com">Youtube Me</a>

    <!-- Image Element -> Inline Element -->
    <p>This is an image <img src="https://static.vecteezy.com/system/resources/thumbnails/028/180/885/small_2x/orange-fruit-isolated-on-white-background-whole-orange-citrus-fruit-ai-generative-photo.jpg"></p>

    <p>This is an image</p>
    <img src="https://static.vecteezy.com/system/resources/thumbnails/028/180/885/small_2x/orange-fruit-isolated-on-white-background-whole-orange-citrus-fruit-ai-generative-photo.jpg" alt="">
